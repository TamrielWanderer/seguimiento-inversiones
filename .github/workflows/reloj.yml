name: Reloj de actualizaciones

# El programador de GitHub (schedule) no garantiza los horarios: en este repositorio llegó a pasar
# toda una mañana sin correr nada. Este reloj lo reemplaza: queda despierto de lunes a viernes, le
# pide a «Actualizar y publicar» una actualización en cada horario de la lista y, cada 5 horas, se
# relanza a sí mismo. De noche sigue despierto sin pedir nada: es lo que le permite arrancar a
# horario a la mañana sin depender del programador.
#
# Horarios, de lunes a viernes (hora de Buenos Aires):
# - 03:30: actualización completa para la sesión de Sídney.
# - 08:00 y 09:30: antes de la apertura de Nueva York (pre-mercado).
# - 10:30 a 18:00, cada 30 minutos: mercados abiertos (Buenos Aires y Nueva York, verano e invierno).
# - 18:30: actualización completa (dividendos, noticias, inflación), que guarda los datos.
# - 19:30: después del cierre (after-market). El viernes, ahí se apaga hasta el lunes.
#
# El lunes lo arranca el programador de GitHub, que puede atrasarse horas: por eso se le pide cada
# media hora desde el domingo a la noche. También arranca con cualquier cambio que se suba o con
# «Run workflow».
on:
  schedule:
    - cron: "13,43 * * * 1"        # lunes (UTC), cada media hora: el arranque de la semana
    - cron: "43 1,7,10,12,15,19 * * 2-5"   # de martes a viernes: respaldo por si el reloj se cayó
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      relevo:
        description: "Uso interno: lo marca el reloj cuando se relanza a sí mismo"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

# Un solo reloj a la vez. Si ya hay uno andando, el nuevo espera y, al tocarle, ve que no hace falta.
concurrency:
  group: reloj
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Pedir las actualizaciones del día
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
          RELEVO: ${{ inputs.relevo }}
        run: |
          set -u
          # Todo en UTC (Buenos Aires + 3 h). minuto del día = hora × 60 + minutos.
          minuto() { echo $(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) )); }
          habil() { [ "$(date -u +%u)" -le 5 ]; }
          # La semana del reloj: de lunes a viernes, hasta el viernes 22:35 UTC (19:35 de Buenos Aires).
          en_dia() { habil && { [ "$(date -u +%u)" -lt 5 ] || [ "$(minuto)" -lt 1355 ]; }; }
          # Qué pedir en este horario (vacío = nada).
          modo_de() {
            local t=$1
            if   [ "$t" -ge 1290 ] && [ "$t" -lt 1320 ]; then echo completo        # 21:30 UTC
            elif [ "$t" -ge 810 ]  && [ "$t" -lt 1290 ]; then echo rapido          # 13:30 a 21:29
            elif [ "$t" -ge 660 ]  && [ "$t" -lt 690 ];  then echo rapido          # 11:00 (pre-mercado)
            elif [ "$t" -ge 750 ]  && [ "$t" -lt 780 ];  then echo rapido          # 12:30 (pre-mercado)
            elif [ "$t" -ge 1350 ] && [ "$t" -lt 1380 ]; then echo rapido          # 22:30 (after-market)
            elif [ "$t" -ge 390 ]  && [ "$t" -lt 420 ];  then echo completo        # 06:30 (Sídney)
            fi
          }
          pedir() {
            local modo; modo=$(modo_de "$(minuto)")
            [ -z "$modo" ] && return 0
            echo "$(date -u +%H:%M) UTC: pido actualización $modo"
            gh workflow run publicar.yml -R "$REPO" --ref main -f modo="$modo" || echo "No se pudo pedir; sigue en el próximo horario."
          }
          # Dormir hasta 2 minutos después de la próxima media hora en punto.
          dormir() { local s; s=$(date +%s); sleep $(( 1800 - (s - 120) % 1800 )); }

          if ! en_dia; then echo "Fin de semana: no hay nada que hacer."; exit 0; fi
          # Tiempo de trabajo de esta corrida: 5 horas (el límite de GitHub por corrida es 6).
          fin=$(( $(date +%s) + 300 * 60 ))
          # Arrancado a mano o como relevo: pide ya. Arrancado por el programador o por un cambio
          # subido (que ya dispara su propia actualización): espera al próximo horario.
          if [ "$EVENTO" = "workflow_dispatch" ]; then pedir; fi
          while true; do
            dormir
            en_dia || { echo "Terminó la semana: el reloj se apaga hasta el lunes."; exit 0; }
            if [ "$(date +%s)" -ge "$fin" ]; then
              echo "Se acaba el tiempo de esta corrida: sigue un reloj nuevo."
              gh workflow run reloj.yml -R "$REPO" --ref main -f relevo=true
              exit 0
            fi
            pedir
          done
