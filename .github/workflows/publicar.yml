name: Actualizar y publicar

# Baja los datos, compila la página y la publica en GitHub Pages.
# - Automático: de lunes a viernes a las 18:40 de Buenos Aires (21:40 UTC), después del cierre
#   de Nueva York y de BYMA.
# - Al subir cambios (por ejemplo, editar datos/catalogo.json o datos/noticias.json desde GitHub).
# - A mano: pestaña Actions → «Actualizar y publicar» → «Run workflow».
on:
  schedule:
    - cron: "40 21 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Bajar cotizaciones, dólar y noticias
        if: github.event_name != 'push'
        id: datos
        continue-on-error: true   # si Yahoo no responde, se publica con los datos anteriores
        run: npm run actualizar

      - name: Probar cálculos
        run: npm run probar

      - name: Compilar la página
        run: npm run build
        env:
          # La copia que se manda por mail/WhatsApp busca acá los datos nuevos.
          VITE_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/datos.json

      - name: Guardar los datos nuevos en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add datos public src
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos del $(TZ=America/Argentina/Buenos_Aires date +'%d/%m/%Y %H:%M')"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
