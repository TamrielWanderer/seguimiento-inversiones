name: Actualizar y publicar

# Baja los datos, compila la página y la publica en GitHub Pages.
# - Rápido (solo precios y dólar): cada 30 minutos de lunes a viernes, de 05:00 a 22:00 de Buenos
#   Aires. Lo dispara el «Reloj de actualizaciones» (reloj.yml), porque el programador de GitHub
#   saltea la mayoría de las corridas que se le piden cada media hora. No guarda nada en el repositorio.
# - Completo (además dividendos, resultados, noticias, inflación e historia del dólar): después del
#   cierre de Nueva York y a la madrugada para la sesión de Sídney. Guarda los datos.
# - Al subir cambios (por ejemplo, editar datos/catalogo.json o datos/noticias.json desde GitHub):
#   también baja datos nuevos, así un título recién agregado aparece enseguida.
#   (Los commits de datos que hace este mismo flujo no lo vuelven a disparar.)
# - A mano: pestaña Actions → «Actualizar y publicar» → «Run workflow».
on:
  schedule:
    - cron: "40 21 * * 1-5"
    - cron: "30 6 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      modo:
        description: "completo (todo, y guarda los datos) o rapido (solo precios y dólar)"
        type: choice
        options: [completo, rapido]
        default: completo

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Bajar cotizaciones, dólar y noticias
        id: datos
        continue-on-error: true   # si Yahoo no responde, se publica con los datos anteriores
        run: |
          if [ "${{ inputs.modo }}" = "rapido" ]; then
            npm run actualizar -- --rapido
          else
            npm run actualizar
          fi

      - name: Probar cálculos
        run: npm run probar

      - name: Compilar la página
        run: npm run build
        env:
          # La copia que se manda por mail/WhatsApp busca acá los datos nuevos.
          VITE_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/datos.json

      - name: Guardar los datos nuevos en el repositorio
        if: ${{ inputs.modo != 'rapido' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos del $(TZ=America/Argentina/Buenos_Aires date +'%d/%m/%Y %H:%M')"
            git pull --rebase --autostash -X theirs
            git push
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
